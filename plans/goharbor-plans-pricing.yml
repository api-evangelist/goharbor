description: >-
  Harbor publishes no plans and no pricing, because there is nothing to buy. Harbor is an
  Apache-2.0 licensed CNCF project that you install and operate yourself: goharbor.io has no
  pricing page, no sign-up flow and no billing surface anywhere on the site (checked
  2026-09-12 — the primary navigation is Getting Started, Community, Blog, Docs and CLI
  Docs). The only cost of running Harbor is the infrastructure the operator provides.
  Commercial Harbor-based offerings exist from third parties, but they are those vendors'
  products and are not priced by this project.
supersedes: >-
  This file previously carried a three-tier Free/Professional/Enterprise scaffold with
  invented quotas ("1000 requests/month", "price: TBD") written by the 2026-05-04 bulk
  sweep. Harbor has no such tiers. The scaffold was removed 2026-09-12 and replaced with
  this measured zero.
related_limits:
  note: >-
    Harbor does have QUOTAS, but they are an operator-configured storage limit per project,
    not a commercial plan — see
    https://goharbor.io/docs/2.15.0/administration/configure-project-quotas/ and the
    quota operations (listQuotas / getQuota / updateQuota) in the published contract.
