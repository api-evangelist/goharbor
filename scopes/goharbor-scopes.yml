generated: '2026-09-12'
method: searched
source: https://goharbor.io/docs/2.15.0/administration/robot-accounts/#permission-references
provider: Harbor
providerId: goharbor
model: robot-account-permissions
oauth2: false
description: 'Harbor''s scope surface is its robot-account permission model, not OAuth. A robot account
  (or a user role) is granted an explicit set of <action>:<resource> permissions, and Harbor publishes
  the exact API operations each permission unlocks. That published table — reproduced verbatim below —
  is the scope reference for this API: it is what you consult to give an agent or a pipeline the least
  privilege it needs. Permissions exist at two levels, system-wide and per-project, and a system robot
  account can carry both. There is no OAuth 2.0 authorization server and no scope string in an access
  token; the permission set is bound to the robot account at creation and presented as HTTP Basic credentials.'
grant:
  mechanism: Robot account created with an explicit permission list (POST /robots) or inherited from a
    project role.
  presentation: HTTP Basic — robot account name as user, secret as password.
  secret_recovery: Harbor does not store robot secrets. A lost secret can only be rotated (PATCH /robots/{robot_id}),
    never retrieved.
  expiry: Set per robot account at creation; "never expires" is selectable.
  docs: https://goharbor.io/docs/2.15.0/working-with-projects/project-configuration/create-robot-accounts/
constraints:
- Push Repository must be assigned together with Pull Repository; it cannot be granted alone.
- Robot accounts cannot log in to the Harbor web UI.
- A system robot account may be scoped to selected projects or set to cover all existing and future projects.
counts:
  system_permissions: 70
  project_permissions: 64
