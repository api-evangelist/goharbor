aid: goharbor
name: GoHarbor
description: >-
  Harbor is an open source, CNCF-hosted registry that stores, signs and scans OCI artifacts,
  adding the policy and identity layer a plain container registry lacks: projects, RBAC and
  robot accounts, vulnerability scanning and SBOM generation, Cosign content trust, tag
  retention and immutability, quotas, replication between registries and P2P preheat. It is
  Apache-2.0 and self-hosted, so every API base URL is the operator's own deployment rather
  than a vendor endpoint. Harbor publishes a 203-operation v2.0 REST API in its own
  repository, serves a live Swagger UI from every instance at /devcenter-api-2.0, speaks the
  OCI Distribution Specification on /v2/, emits ten project event types over webhooks in
  CloudEvents 1.0 format, and ships an official CLI, Go client, Helm chart and Terraform
  provider.
type: Index
deliveryModel:
  model: self-hosted
  license: Apache-2.0
  open_source: true
  commercial: false
