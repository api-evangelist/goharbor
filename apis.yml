- aid: goharbor:goharbor-harbor-v2-api
  name: Harbor v2.0 REST API
  description: >-
    Harbor's complete, first-party v2.0 REST API as published in the project's own
    repository (api/v2.0/swagger.yaml) — 135 paths, 203 operations and 153 definitions
    covering projects, repositories, artifacts, tags, labels, accessories, scanning, SBOMs,
    robot accounts, users and groups, quotas, registries, replication, retention,
    immutability, webhooks, preheat, garbage collection, audit logs, the Security Hub and
    system configuration. Authenticates with HTTP Basic; the base URL is the operator's own
    Harbor instance.
  humanURL: https://goharbor.io/docs/2.15.0/working-with-projects/using-api-explorer/
