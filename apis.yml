- aid: goharbor:goharbor-scanner-adapter-api
  name: Harbor Scanner Adapter API
  description: >-
    The contract a vulnerability scanner vendor implements so it can be registered as a
    pluggable scanner in Harbor. OpenAPI 3.0, three operations — GET /metadata to advertise
    capabilities, POST /scan to accept an asynchronous scan request, and GET
    /scan/{scan_request_id}/report to return the report Harbor polls for. Published by the
    Harbor project in goharbor/pluggable-scanner-spec.
  humanURL: https://github.com/goharbor/pluggable-scanner-spec
  baseURL: https://{scanner-adapter}/api/v1
