          format: int64
          description: The ID of the repository that the artifact belongs to
        repository_name:
          type: string
          description: The name of the repository that the artifact belongs to
        digest:
          type: string
          description: The digest of the artifact
        size:
          type: integer
          format: int64
          description: The size of the artifact
        icon:
          type: string
          description: The digest of the icon
        push_time:
          type: string
          format: date-time
          description: The push time of the artifact
        pull_time:
          type: string
          format: date-time
          description: The latest pull time of the artifact
        extra_attrs:
          $ref: '#/components/schemas/ExtraAttrs'
        annotations:
          $ref: '#/components/schemas/Annotations'
        references:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        addition_links:
          $ref: '#/components/schemas/AdditionLinks'
        labels:
          type: array
          items:
            $ref: '#/components/schemas/Label'
        scan_overview:
          $ref: '#/components/schemas/ScanOverview'
          description: The overview of the scan result.
        sbom_overview:
          $ref: '#/components/schemas/SBOMOverview'
          description: The overview of the generating SBOM progress
        accessories:
          type: array
          items:
            $ref: '#/components/schemas/Accessory'
            description: The accessory of the artifact.
        inherited_accessories:
          type: array
          x-omitempty: true
          description: 'The signatures of the parent OCI index(es) that reference this artifact, both

            cosign and notation. A signature on an index covers the whole index, so a child

            manifest of a signed index is covered by that signature even though it carries

            none of its own. These entries describe the parent, not this artifact: their

            subject_artifact_digest is the index digest, so verifying them against this

            artifact''s digest fails and they are not listed by the referrers API for this

            digest. Only returned when the with_inherited_accessory query parameter is set

            to true.

            '
          items:
            $ref: '#/components/schemas/Accessory'
            description: The accessory inherited from the parent OCI index.
    ScanOverview:
      type: object
      description: The scan overview attached in the metadata of tag
      additionalProperties:
        $ref: '#/components/schemas/NativeReportSummary'
    ProjectMetadata:
      type: object
      properties:
        public:
          type: string
          description: The public status of the project. The valid values are "true", "false".
        enable_content_trust:
          type:
          - string
          - 'null'
          description: Whether content trust is enabled or not. If it is enabled, user can't pull unsigned images from this project. The valid values are "true", "false".
        enable_content_trust_cosign:
          type:
          - string
          - 'null'
          description: Whether cosign content trust is enabled or not. If it is enabled, user can't pull images without cosign signature from this project. The valid values are "true", "false".
        prevent_vul:
          type:
          - string
          - 'null'
          description: Whether prevent the vulnerable images from running. The valid values are "true", "false".
        severity:
          type:
          - string
          - 'null'
          description: If the vulnerability is high than severity defined here, the images can't be pulled. The valid values are "none", "low", "medium", "high", "critical".
        auto_scan:
          type:
          - string
          - 'null'
          description: Whether scan images automatically when pushing. The valid values are "true", "false".
        auto_sbom_generation:
          type:
          - string
          - 'null'
          description: Whether generating SBOM automatically when pushing a subject artifact. The valid values are "true", "false".
        reuse_sys_cve_allowlist:
          type:
          - string
          - 'null'
          description: 'Whether this project reuse the system level CVE allowlist as the allowlist of its own. The valid values are "true", "false".

            If it is set to "true" the actual allowlist associate with this project, if any, will be ignored.'
        retention_id:
          type:
          - string
          - 'null'
          description: The ID of the tag retention policy for the project
        proxy_speed_kb:
          type:
          - string
          - 'null'
          description: The bandwidth limit of proxy cache, in Kbps (kilobits per second). It limits the communication between Harbor and the upstream registry, not the client and the Harbor.
        max_upstream_conn:
          type:
          - string
          - 'null'
          description: The max connection per artifact to the upstream registry in current proxy cache project, if it is -1, no limit to upstream registry connections
        proxy_cache_local_on_not_found:
          type:
          - string
          - 'null'
          description: Whether to serve images from local cache when they are removed from the upstream registry. The valid values are "true", "false".
        proxy_referrer_api:
          type:
          - string
          - 'null'
          description: Whether the proxy cache project should proxy OCI 1.1 referrer API requests to the upstream registry. The valid values are "true", "false".
        proxy_cache_filter_pattern:
          type:
          - string
          - 'null'
          description: Repository filter pattern for proxy cache project. Only repositories matching the pattern will be proxied. Empty means allow all. Only has value when the current project is a proxy cache project.
        proxy_cache_filter_kind:
          type:
          - string
          - 'null'
          description: 'Matching mode for proxy_cache_filter_pattern: "doublestar" (default, glob-style with ** support) or "regex". Only has value when the current project is a proxy cache project.'
    ProjectDeletable:
      type: object
      properties:
        deletable:
          type: boolean
          description: Whether the project can be deleted.
        message:
          type: string
          description: The detail message when the project can not be deleted.
    Scanner:
      type: object
      properties:
        name:
          type: string
          description: Name of the scanner
          example: Trivy
        vendor:
          type: string
          description: Name of the scanner provider
          example: Aqua Security
        version:
          type: string
          description: Version of the scanner adapter
          example: v0.9.1
    ProjectSummary:
      type: object
      properties:
        repo_count:
          type: integer
          description: The number of the repositories under this project.
          x-omitempty: false
        project_admin_count:
          type: integer
          description: The total number of project admin members.
        maintainer_count:
          type: integer
          description: The total number of maintainer members.
        developer_count:
          type: integer
          description: The total number of developer members.
        guest_count:
          type: integer
          description: The total number of guest members.
        limited_guest_count:
          type: integer
          description: The total number of limited guest members.
        quota:
          $ref: '#/components/schemas/ProjectSummaryQuota'
        registry:
          $ref: '#/components/schemas/Registry'
    Tag:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the tag
        repository_id:
          type: integer
          format: int64
          description: The ID of the repository that the tag belongs to
        artifact_id:
          type: integer
          format: int64
          description: The ID of the artifact that the tag attached to
        name:
          type: string
          description: The name of the tag
        push_time:
          type: string
          format: date-time
          description: The push time of the tag
        pull_time:
          type: string
          format: date-time
          description: The latest pull time of the tag
        immutable:
          type: boolean
          x-omitempty: false
          description: The immutable status of the tag
    VulnerabilitySummary:
      type: object
      description: 'VulnerabilitySummary contains the total number of the foun d vulnerabilities number and numbers of each severity level.

        '
      properties:
        total:
          type: integer
          format: int
          description: The total number of the found vulnerabilities
          example: 500
          x-omitempty: false
        fixable:
          type: integer
          format: int
          description: The number of the fixable vulnerabilities
          example: 100
          x-omitempty: false
        summary:
          type: object
          description: Numbers of the vulnerabilities with different severity
          additionalProperties:
            type: integer
            format: int
            example: 10
          example:
            Critical: 5
            High: 5
          x-omitempty: false
    ExtraAttrs:
      type: object
      additionalProperties:
        type: object
    Annotations:
      type: object
      additionalProperties:
        type: string
    CVEAllowlist:
      type: object
      description: The CVE Allowlist for system or project
      properties:
        id:
          type: integer
          description: ID of the allowlist
        project_id:
          type: integer
          description: ID of the project which the allowlist belongs to.  For system level allowlist this attribute is zero.
        expires_at:
          type:
          - integer
          - 'null'
          description: the time for expiration of the allowlist, in the form of seconds since epoch.  This is an optional attribute, if it's not set the CVE allowlist does not expire.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CVEAllowlistItem'
        creation_time:
          type: string
          format: date-time
          description: The creation time of the allowlist.
        update_time:
          type: string
          format: date-time
          description: The update time of the allowlist.
  parameters:
    requestId:
      name: X-Request-Id
      description: An unique ID for the request
      in: header
      required: false
      schema:
        type: string
        minLength: 1
    isResourceName:
      name: X-Is-Resource-Name
      description: The flag to indicate whether the parameter which supports both name and id in the path is the name of the resource. When the X-Is-Resource-Name is false and the parameter can be converted to an integer, the parameter will be as an id, otherwise, it will be as a name.
      in: header
      required: false
      schema:
        type: boolean
        default: false
    projectNameOrId:
      name: project_name_or_id
      in: path
      description: The name or id of the project
      required: true
      schema:
        type: string
    projectName:
      name: project_name
      in: path
      description: The name of the project
      required: true
      schema:
        type: string
    resourceNameInLocation:
      name: X-Resource-Name-In-Location
      description: The flag to indicate whether to return the name of the resource in Location. When X-Resource-Name-In-Location is true, the Location will return the name of the resource.
      in: header
      required: false
      schema:
        type: boolean
        default: false
    sort:
      name: sort
      description: Sort the resource list in ascending or descending order. e.g. sort by field1 in ascending order and field2 in descending order with "sort=field1,-field2"
      in: query
      required: false
      schema:
        type: string
    page:
      name: page
      in: query
      required: false
      description: The page number
      schema:
        type: integer
        format: int64
        default: 1
    pageSize:
      name: page_size
      in: query
      required: false
      description: The size of per page
      schema:
        type: integer
        format: int64
        default: 10
        maximum: 100
    acceptVulnerabilities:
      name: X-Accept-Vulnerabilities
      in: header
      description: 'A comma-separated lists of MIME types for the scan report or scan summary. The first mime type will be used when the report found for it.

        Currently the mime type supports ''application/vnd.scanner.adapter.vuln.report.harbor+json; version=1.0'' and ''application/vnd.security.vulnerability.report; version=1.1'''
      schema:
        type: string
        default: application/vnd.security.vulnerability.report; version=1.1, application/vnd.scanner.adapter.vuln.report.harbor+json; version=1.0
    query:
      name: q
      description: Query string to query resources. Supported query patterns are "exact match(k=v)", "fuzzy match(k=~v)", "range(k=[min~max])", "list with union releationship(k={v1 v2 v3})" and "list with intersetion relationship(k=(v1 v2 v3))". The value of range and list can be string(enclosed by " or '), integer or time(in format "2020-04-09 02:36:00"). All of these query patterns should be put in the query string "q=xxx" and splitted by ",". e.g. q=k1=v1,k2=~v2,k3=[min~max]
      in: query
      required: false
      schema:
        type: string
  securitySchemes:
    basic:
      type: http
      scheme: basic
