openapi: 3.2.0
info:
  title: Harbor Project API
  description: These APIs provide services for manipulating Harbor project.
  version: '2.0'
servers:
- url: http://localhost/api/v2.0
- url: https://localhost/api/v2.0
security:
- basic: []
- {}
tags:
- name: Project
paths:
  /projects:
    get:
      summary: List projects
      description: This endpoint returns projects created by Harbor.
      tags:
      - Project
      operationId: listProjects
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/query'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/sort'
      - name: name
        in: query
        description: The name of project.
        required: false
        schema:
          type: string
      - name: public
        in: query
        description: The project is public or private.
        required: false
        schema:
          type: boolean
      - name: owner
        in: query
        description: The name of project owner.
        required: false
        schema:
          type: string
      - name: with_detail
        in: query
        description: Bool value indicating whether return detailed information of the project
        required: false
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Return all matched projects.
          headers:
            X-Total-Count:
              description: The total count of projects
              schema:
                type: integer
            Link:
              description: Link refers to the previous page and next page
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
    head:
      summary: Check if the project name user provided already exists
      description: This endpoint is used to check if the project name provided already exist.
      tags:
      - Project
      operationId: headProject
      parameters:
      - $ref: '#/components/parameters/requestId'
      - name: project_name
        in: query
        description: Project name for checking exists.
        required: true
        schema:
          type: string
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
    post:
      summary: Create a new project
      description: This endpoint is for user to create a new project.
      tags:
      - Project
      operationId: createProject
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/resourceNameInLocation'
      responses:
        '201':
          $ref: '#/components/responses/201'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '409':
          description: Project name already exists.
          headers:
            X-Request-Id:
              description: The ID of the corresponding request for the response
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          $ref: '#/components/responses/500'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectReq'
        description: New created project.
        required: true
  /projects/{project_name_or_id}:
    get:
      summary: Return specific project detail information
      description: This endpoint returns specific project information by project ID.
      tags:
      - Project
      operationId: getProject
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/isResourceName'
      - $ref: '#/components/parameters/projectNameOrId'
      responses:
        '200':
          description: Return matched project information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: Project not found. No project exists with the specified name or ID.
          headers:
            X-Request-Id:
              description: The ID of the corresponding request for the response
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          $ref: '#/components/responses/500'
    put:
      summary: Update properties for a selected project
      description: This endpoint is aimed to update the properties of a project.
      tags:
      - Project
      operationId: updateProject
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/isResourceName'
      - $ref: '#/components/parameters/projectNameOrId'
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectReq'
        description: Updates of project.
        required: true
    delete:
      summary: Delete project by projectID
      description: This endpoint is aimed to delete project by project ID.
      tags:
      - Project
      operationId: deleteProject
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/isResourceName'
      - $ref: '#/components/parameters/projectNameOrId'
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: Project not found. No project exists with the specified name or ID.
          headers:
            X-Request-Id:
              description: The ID of the corresponding request for the response
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '412':
          description: Project cannot be deleted. The project still contains repositories or has pending tasks.
          headers:
            X-Request-Id:
              description: The ID of the corresponding request for the response
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          $ref: '#/components/responses/500'
  /projects/{project_name_or_id}/_deletable:
    get:
      summary: Get the deletable status of the project
      tags:
      - Project
      operationId: getProjectDeletable
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/isResourceName'
      - $ref: '#/components/parameters/projectNameOrId'
      responses:
        '200':
          description: Return deletable status of the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDeletable'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /projects/{project_name_or_id}/summary:
    get:
      summary: Get summary of the project
      description: Get summary of the project.
      tags:
      - Project
      operationId: getProjectSummary
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/isResourceName'
      - $ref: '#/components/parameters/projectNameOrId'
      responses:
        '200':
          description: Get summary of the project successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectSummary'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
  /projects/{project_name_or_id}/artifacts:
    get:
      summary: List artifacts
      description: List artifacts of the specified project
      tags:
      - Project
      operationId: listArtifactsOfProject
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/isResourceName'
      - $ref: '#/components/parameters/projectNameOrId'
      - $ref: '#/components/parameters/query'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/acceptVulnerabilities'
      - name: with_tag
        in: query
        description: Specify whether the tags are included inside the returning artifacts
        required: false
        schema:
          type: boolean
          default: true
      - name: with_label
        in: query
        description: Specify whether the labels are included inside the returning artifacts
        required: false
        schema:
          type: boolean
          default: false
      - name: with_scan_overview
        in: query
        description: Specify whether the scan overview is included inside the returning artifacts
        required: false
        schema:
          type: boolean
          default: false
      - name: with_sbom_overview
        in: query
        description: Specify whether the SBOM overview is included in returning artifacts, when this option is true, the SBOM overview will be included in the response
        required: false
        schema:
          type: boolean
          default: false
      - name: with_immutable_status
        in: query
        description: Specify whether the immutable status is included inside the tags of the returning artifacts. Only works when setting "with_immutable_status=true"
        required: false
        schema:
          type: boolean
          default: false
      - name: with_accessory
        in: query
        description: Specify whether the accessories are included of the returning artifacts. Only works when setting "with_accessory=true"
        required: false
        schema:
          type: boolean
          default: false
      - name: with_inherited_accessory
        in: query
        description: Specify whether the accessories of the parent OCI index(es) referencing the artifact are included, in the separate inherited_accessories field. Off by default because it costs an extra reference lookup per artifact.
        required: false
        schema:
          type: boolean
          default: false
      - name: latest_in_repository
        in: query
        description: Specify whether only the latest pushed artifact of each repository is included inside the returning artifacts. Only works when either artifact_type or media_type is included in the query.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Success
          headers:
            X-Total-Count:
              description: The total count of artifacts
              schema:
                type: integer
            Link:
              description: Link refers to the previous page and next page
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artifact'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
  /projects/{project_name_or_id}/scanner:
    get:
      summary: Get project level scanner
      description: Get the scanner registration of the specified project. If no scanner registration is configured for the specified project, the system default scanner registration will be returned.
      tags:
      - Project
      operationId: getScannerOfProject
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/isResourceName'
      - $ref: '#/components/parameters/projectNameOrId'
      responses:
        '200':
          description: The details of the scanner registration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerRegistration'
        '400':
          description: Bad project ID
        '401':
          description: Unauthorized request
        '403':
          description: Request is not allowed
        '404':
          description: The requested object is not found
        '500':
          description: Internal server error happened
    put:
      summary: Configure scanner for the specified project
      description: Set one of the system configured scanner registration as the indepndent scanner of the specified project.
      tags:
      - Project
      operationId: setScannerOfProject
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/isResourceName'
      - $ref: '#/components/parameters/projectNameOrId'
      responses:
        '200':
          $ref: '#/components/responses/200'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectScanner'
        required: true
  /projects/{project_name_or_id}/scanner/candidates:
    get:
      summary: Get scanner registration candidates for configurating project level scanner
      description: Retrieve the system configured scanner registrations as candidates of setting project level scanner.
      tags:
      - Project
      operationId: listScannerCandidatesOfProject
      parameters:
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/isResourceName'
      - $ref: '#/components/parameters/projectNameOrId'
      - $ref: '#/components/parameters/query'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: A list of scanner registrations.
          headers:
            X-Total-Count:
              description: The total count of available items
              schema:
                type: integer
            Link:
              description: Link to previous page and next page
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScannerRegistration'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
  /projects/{project_name}/logs:
    get:
      summary: Get recent logs of the projects (deprecated)
      description: Get recent logs of the projects, it only query the previous version's audit log
      tags:
      - Project
      operationId: getLogs
      parameters:
      - $ref: '#/components/parameters/projectName'
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/query'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Success
          headers:
            X-Total-Count:
              description: The total count of auditlogs
              schema:
                type: integer
            Link:
              description: Link refers to the previous page and next page
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /projects/{project_name}/auditlog-exts:
    get:
      summary: Get recent logs of the projects
      tags:
      - Project
      operationId: getLogExts
      parameters:
      - $ref: '#/components/parameters/projectName'
      - $ref: '#/components/parameters/requestId'
      - $ref: '#/components/parameters/query'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Success
          headers:
            X-Total-Count:
              description: The total count of auditlogs
              schema:
                type: integer
            Link:
              description: Link refers to the previous page and next page
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogExt'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
components:
  responses:
    '400':
      description: Bad request. The request body or query parameters are invalid. Inspect the `errors` array in the response body for details.
      headers:
        X-Request-Id:
          description: The ID of the corresponding request for the response
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    '201':
      description: Created
      headers:
        X-Request-Id:
          description: The ID of the corresponding request for the response
          schema:
            type: string
        Location:
          description: The location of the resource
          schema:
            type: string
    '422':
      description: Unprocessable entity. The request was well-formed but could not be processed (for example, due to validation errors). Inspect the `errors` array in the response body for details.
      headers:
        X-Request-Id:
          description: The ID of the corresponding request for the response
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    '200':
      description: Success
      headers:
        X-Request-Id:
          description: The ID of the corresponding request for the response
          schema:
            type: string
    '404':
      description: Not found. The requested resource does not exist.
      headers:
        X-Request-Id:
          description: The ID of the corresponding request for the response
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    '401':
      description: Unauthorized. Authentication is required to access this resource.
      headers:
        X-Request-Id:
          description: The ID of the corresponding request for the response
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    '403':
      description: Forbidden. The caller does not have sufficient permission to perform the requested operation.
      headers:
        X-Request-Id:
          description: The ID of the corresponding request for the response
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
    '500':
      description: Internal server error. Inspect the `errors` array in the response body for details.
      headers:
        X-Request-Id:
          description: The ID of the corresponding request for the response
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
  schemas:
    ResourceList:
      type: object
      additionalProperties:
        type: integer
        format: int64
    Label:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: The ID of the label
        name:
          type: string
          description: The name the label
        description:
          type: string
          description: The description the label
        color:
          type: string
          description: The color the label
        scope:
          type: string
          description: The scope the label
        project_id:
          type: integer
          format: int64
          description: The ID of project that the label belongs to
        creation_time:
          type: string
          format: date-time
          description: The creation time the label
        update_time:
          type: string
          format: date-time
          description: The update time of the label
    ProjectSummaryQuota:
      type: object
      properties:
        hard:
          $ref: '#/components/schemas/ResourceList'
          description: The hard limits of the quota
        used:
          $ref: '#/components/schemas/ResourceList'
          description: The used status of the quota
    RegistryCredential:
      type: object
      properties:
        type:
          type: string
          description: Credential type, such as 'basic', 'oauth'.
        access_key:
          type: string
          description: Access key, e.g. user name when credential type is 'basic'.
        access_secret:
          type: string
          description: Access secret, e.g. password when credential type is 'basic'.
    AuditLogExt:
      type: object
      properties:
        id:
          type: integer
          description: The ID of the audit log entry.
        username:
          type: string
          description: The username of the operator in this log entry.
        resource:
          type: string
          description: Name of the resource in this log entry.
        resource_type:
          type: string
          description: Type of the resource in this log entry.
        operation:
          type: string
          description: The operation against the resource in this log entry.
        operation_description:
          type: string
          description: The operation's detail description
        operation_result:
          type: boolean
          x-omitempty: false
          description: the operation's result, true for success, false for fail
        op_time:
          type: string
          format: date-time
          example: '2006-01-02T15:04:05Z'
          description: The time when this operation is triggered.
    Error:
      description: a model for all the error response coming from harbor
      type: object
      properties:
        code:
          type: string
          description: The error code
        message:
          type: string
          description: The error message
      example:
        code: NOT_FOUND
        message: artifact library/hello-world:latest not found
    ScannerRegistration:
      type: object
      description: 'Registration represents a named configuration for invoking a scanner via its adapter.

        '
      properties:
        uuid:
          type: string
          description: The unique identifier of this registration.
        name:
          type: string
          example: Trivy
          description: The name of this registration.
        description:
          type: string
          description: An optional description of this registration.
          example: 'A free-to-use tool that scans container images for package vulnerabilities.

            '
          x-omitempty: false
        url:
          type: string
          format: uri
          description: A base URL of the scanner adapter
          example: http://harbor-scanner-trivy:8080
        disabled:
          type: boolean
          default: false
          description: Indicate whether the registration is enabled or not
          x-omitempty: false
        is_default:
          type: boolean
          default: false
          description: Indicate if the registration is set as the system default one
          x-omitempty: false
        auth:
          type: string
          default: ''
          description: 'Specify what authentication approach is adopted for the HTTP communications.

            Supported types Basic", "Bearer" and api key header "X-ScannerAdapter-API-Key"

            '
          example: Bearer
          x-omitempty: false
        access_credential:
          type: string
          description: 'An optional value of the HTTP Authorization header sent with each request to the Scanner Adapter API.

            '
          example: 'Bearer: JWTTOKENGOESHERE'
          x-omitempty: false
        skip_certVerify:
          type: boolean
          default: false
          description: Indicate if skip the certificate verification when sending HTTP requests
          x-omitempty: false
        use_internal_addr:
          type: boolean
          default: false
          description: Indicate whether use internal registry addr for the scanner to pull content or not
          x-omitempty: false
        create_time:
          type: string
          format: date-time
          description: The creation time of this registration
        update_time:
          type: string
          format: date-time
          description: The update time of this registration
        adapter:
          type: string
          description: Optional property to describe the name of the scanner registration
          example: Trivy
        vendor:
          type: string
          description: Optional property to describe the vendor of the scanner registration
          example: CentOS
        version:
          type: string
          description: Optional property to describe the version of the scanner registration
          example: 1.0.1
        health:
          type: string
          default: ''
          description: Indicate the healthy of the registration
          example: healthy
        capabilities:
          type: object
          description: Indicates the capabilities of the scanner, e.g. support_vulnerability or support_sbom.
          additionalProperties: true
          example:
            support_vulnerability: true
            support_sbom: true
    AdditionLink:
      type: object
      properties:
        href:
          type: string
          description: The link of the addition
        absolute:
          type: boolean
          x-omitempty: false
          description: Determine whether the link is an absolute URL or not
    Platform:
      type: object
      properties:
        architecture:
          type: string
          description: The architecture that the artifact applys to
        os:
          type: string
          description: The OS that the artifact applys to
        '''os.version''':
          type: string
          description: The version of the OS that the artifact applys to
        '''os.features''':
          type: array
          description: The features of the OS that the artifact applys to
          items:
            type: string
        variant:
          type: string
          description: The variant of the CPU
    ProjectReq:
      type: object
      properties:
        project_name:
          type: string
          description: The name of the project.
          maxLength: 255
        public:
          type:
          - boolean
          - 'null'
          description: deprecated, reserved for project creation in replication
        metadata:
          description: The metadata of the project.
          $ref: '#/components/schemas/ProjectMetadata'
        cve_allowlist:
          description: The CVE allowlist of the project.
          $ref: '#/components/schemas/CVEAllowlist'
        storage_limit:
          type:
          - integer
          - 'null'
          format: int64
          description: The storage quota of the project.
        registry_id:
