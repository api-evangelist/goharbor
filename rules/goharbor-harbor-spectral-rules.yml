# harvested from https://github.com/goharbor/harbor/blob/4d425b805f318eb8dfe621842c02bef8dc0c0959/.spectral.yaml on 2026-10-09 — a Spectral ruleset published in the provider's own GitHub repository (goharbor/harbor); found by GitHub code search, fetched verbatim
x-method: harvested
x-stamped: 2026-10-09
x-source-url: https://github.com/goharbor/harbor/blob/4d425b805f318eb8dfe621842c02bef8dc0c0959/.spectral.yaml
extends: [[spectral:oas, all]]

functionsDir: "./tools/spectral/functions"

functions: [requireRequestId]

rules:
  no-$ref-siblings: false
  oas2-valid-schema-example: false

  required-operationId:
    description: must have a operationId.
    given: $.paths[*][*]
    severity: error
    then:
      field: operationId
      function: truthy

  camel-case-operationId:
    description: should be camelCased.
    type: style
    given: $.paths[*][*].operationId
    then:
      function: casing
      functionOptions:
        type: camel

  requestId-required:
    description: must have a requestId parameters.
    given: $.paths[*][*]
    severity: error
    then:
      field: parameters
      function: requireRequestId

  operation-description:
    description: Every operation must have a description field.
    given: $.paths[*][*]
    severity: error
    then:
      field: description
      function: truthy

  operation-summary-required:
    description: Every operation must have a summary field.
    given: $.paths[*][*]
    severity: error
    then:
      field: summary
      function: truthy
