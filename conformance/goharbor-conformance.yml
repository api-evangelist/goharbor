description: >-
  Standards Harbor implements, each recorded against evidence we fetched. The
  domain standard for this market is the OCI Distribution Specification — a container
  registry that speaks it is interchangeable with every other registry and client in the
  ecosystem, and Harbor's own deployments answer the /v2/ discovery endpoint with the
  distribution API version header, which is the definitive signature.
domain_standard:
  id: oci-distribution
  name: OCI Distribution Specification
  market: container registry
  conforms: true
  evidence: >-
    GET https://demo.goharbor.io/v2/ → HTTP 401 with
    `docker-distribution-api-version: registry/2.0` and
    `www-authenticate: Bearer realm="https://demo.goharbor.io/service/token",service="harbor-registry"`.
    Identical response shape from https://registry.goharbor.io/v2/ (probed 2026-09-12). The
    401 + token-realm challenge on /v2/ IS the OCI distribution handshake; an unauthenticated
    401 there is the specified behaviour, not a failure.
  docs: https://goharbor.io/docs/2.15.0/working-with-projects/working-with-oci/
  note: >-
    Harbor also exposes GET /v2/_catalog as a permissioned ability in its own permission
    reference, and its REST API models OCI artifacts, accessories, referrers and digests as
    first-class resources — the standard is in the data model, not only at the edge.
