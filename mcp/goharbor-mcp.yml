description: >-
  Harbor publishes NO first-party MCP server. The goharbor GitHub organization (29 repos,
  enumerated 2026-09-12) contains no MCP implementation, and no hosted MCP endpoint is
  documented anywhere on goharbor.io. The tools below are a CANDIDATE surface derived from
  real operationIds in Harbor's own api/v2.0/swagger.yaml — they are a proposal for what a
  Harbor MCP server should expose, not something a client can call today. Because Harbor is
  self-hosted, any future server would have to be pointed at the operator's own instance
  (https://{host}/api/v2.0), so a vendor-hosted remote endpoint is unlikely by design; a
  local stdio server shipped alongside harbor-cli is the natural shape.
