auth:
  model: http-basic
  note: The Harbor v2.0 API authenticates with HTTP Basic (user credentials, a robot account name + secret, or an OIDC CLI secret). An MCP server would carry a robot account whose permission set is chosen from the Harbor permission reference (see scopes/goharbor-scopes.yml).
